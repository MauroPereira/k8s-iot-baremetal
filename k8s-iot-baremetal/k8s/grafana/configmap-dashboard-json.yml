          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb-iot"
              },
              "query": "  from(bucket: \"iot-bucket\")\n    |> range(start: -10s)\n    |> filter(fn: (r) => r._measurement == \"sensors\")\n    |> filter(fn: (r) => r._field == \"temperatura\")\n    |> filter(fn: (r) => r.device_id != \"healthcheck\")\n    |> group(columns: [\"device_id\"])\n    |> distinct(column: \"device_id\")\n    |> count()",
              "refId": "A"
            }
          ],
          "title": "Connected devices",
          "type": "stat"
