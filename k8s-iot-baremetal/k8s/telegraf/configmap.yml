apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
  namespace: iot
data:
  telegraf.conf: |
    [agent]
      interval = "10s"
      flush_interval = "10s"

    [[inputs.mqtt_consumer]]
      servers = ["tcp://mosquitto:1883"]
      topics = ["sensors/#"]
      topic_tag = "topic"
      data_format = "json"
      name_override = "sensors"
      tag_keys = ["device_id", "location"]

    [[outputs.influxdb_v2]]
      urls = ["http://influxdb:8086"]
      token = "$INFLUXDB_TOKEN"
      organization = "iot-org"
      bucket = "iot-bucket"
